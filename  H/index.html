<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Shapes</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Main Container (parent) -->
    <main>
      <!-- left column (4 interactive triangles) -->
      <div class="column left-column">
        <div class="triangle left-side" id="left1"></div>
        <div class="triangle left-side" id="left2"></div>
        <div class="triangle left-side" id="left3"></div>
        <div class="triangle left-side" id="left4"></div>
      </div>

      <!-- middle -->
      <div class="column middle-column">
        <div class="triangle" id="left"></div>
        <div class="triangle" id="right"></div>
      </div>

      <!-- right column -->
      <div class="column right-column">
        <div class="triangle right-side" id="right1"></div>
        <div class="triangle right-side" id="right2"></div>
        <div class="triangle right-side" id="right3"></div>
        <div class="triangle right-side" id="right4"></div>
      </div>
    </main>
  </body>
</html>
