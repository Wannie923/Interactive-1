    <title>Interactive Alphabet</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- page1 black background-white letter-->
    <section class="page page-dark">
      <div class="letters-container">
        <main class="letter-box" id="page1-letter-A">

          <div class="triangle" id="A2"></div>

          <div class="triangle" id="A7"></div>
          <div class="triangle" id="A8"></div>
        </main>

        <main class="letter-box" id="page1-letter-B">

          <div class="triangle" id="B2"></div>

          <div class="triangle" id="B7"></div>
          <div class="triangle" id="B8"></div>

          <div class="triangle" id="B10"></div>

          <div class="triangle" id="B12"></div>

        <main class="letter-box" id="page1-letter-F"></main>
        <main class="letter-box" id="page1-letter-G"></main>
        <main class="letter-box" id="page1-letter-H">
          <div class="triangle" id="H1"></div>
          <div class="triangle" id="H2"></div>
        </main>

        <main class="letter-box" id="page1-letter-I"></main>
        <main class="letter-box" id="page1-letter-J"></main>
        <main class="letter-box" id="page1-letter-K"></main>
        <main class="letter-box" id="page1-letter-L"></main>
        <main class="letter-box" id="page1-letter-M"></main>

        <main class="letter-box" id="page1-letter-Y"></main>
        <main class="letter-box" id="page1-letter-Z"></main>
      </div>
    </section>

    <!-- page2 white background-black letter -->
    <section class="page page-light">
      <div class="letters-container">
        <main class="letter-box" id="page2-letter-A"></main>
        <main class="letter-box" id="page2-letter-B"></main>
